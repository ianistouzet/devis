<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracking · Blue dot (v2.0)</title>
<link rel="icon" id="favicon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Crimson+Pro:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c0d; --panel:#121516; --panel2:#191d1f; --line:#282e30;
    --txt:#eef6f6; --muted:#8b9a9a; --brand:#eefdfd; --accent:#eefdfd; --accent2:#d3f2f2; --cyan:#00fffb;
    --cat-client:#5b8cff; --cat-business:#f2a541; --cat-content:#2ec4b6; --cat-training:#c77dff;
    --ok:#2ecc71; --danger:#ff5d5d; --radius:12px;
    --f-title:'Space Grotesk',-apple-system,BlinkMacSystemFont,sans-serif;
    --f-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --f-em:'Crimson Pro',Georgia,serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--f-body);
    background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5}
  h1,h2,h3{margin:0 0 .5em;font-family:var(--f-title);font-weight:600;letter-spacing:-.01em}
  /* Crimson Pro italic accent, +2px vs the Space Grotesk it sits in, in brand colour */
  .em{font-family:var(--f-em);font-style:italic;font-weight:600;color:var(--brand);font-size:calc(1em + 2px);letter-spacing:0}
  button{font-family:var(--f-body);font-weight:600;font-size:14px;cursor:pointer;border:none;border-radius:8px;padding:8px 14px;color:#04201f;background:var(--cyan);transition:.15s}
  button:hover{background:#5cfffb}
  button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500}
  button.ghost:hover{color:var(--txt);border-color:var(--brand);background:transparent}
  button.danger{background:transparent;color:var(--danger);border:1px solid transparent;padding:6px 8px}
  button.danger:hover{background:rgba(255,93,93,.12)}
  button.small{padding:5px 10px;font-size:13px}
  input,select,textarea{font-family:inherit;font-size:14px;background:var(--panel2);color:var(--txt);
    border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
  .wrap{max-width:1080px;margin:0 auto;padding:20px}
  header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  header.top h1{font-size:22px;display:flex;align-items:center;gap:12px;font-weight:600}
  .logo{width:34px;height:34px;display:inline-flex;flex:none}
  .logo svg{width:100%;height:100%;display:block}
  .tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line)}
  .tabs button{background:none;color:var(--muted);border-radius:0;border-bottom:2px solid transparent;padding:10px 14px;font-family:var(--f-title);font-weight:500}
  .tabs button.active{color:var(--txt);border-bottom-color:var(--brand)}
  .tabs button:hover{color:var(--txt)}
  /* Avatars for client logos */
  .avatar{width:26px;height:26px;border-radius:50%;flex:none;background:var(--panel2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--muted);overflow:hidden}
  .avatar:has(img){background:#000}
  .avatar img{width:100%;height:100%;object-fit:contain;padding:2px}
  .avatar.lg{width:40px;height:40px;font-size:15px}
  .avatar.lg img{padding:3px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
  /* Timer bar */
  .timer{display:grid;grid-template-columns:1fr 150px 2fr auto auto;gap:10px;align-items:end}
  .timer .desc{grid-column:1}
  .ctx{display:flex;gap:10px;align-items:end}
  .ctx-inner{display:flex;gap:10px;flex:1}
  .hidden{display:none !important}
  /* Toast (URL-trigger confirmation) */
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);z-index:100;
    background:var(--cyan);color:#04201f;font-weight:600;padding:12px 20px;border-radius:10px;
    box-shadow:0 6px 24px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.25s;font-size:14px}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.stopped{background:var(--danger);color:#fff}
  .elapsed{font-variant-numeric:tabular-nums;font-size:22px;font-weight:600;min-width:96px;text-align:center;align-self:end;height:38px;display:flex;align-items:center;justify-content:center}
  .cat-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
  /* Entries */
  .day-group{margin-bottom:14px}
  .day-head{display:flex;justify-content:space-between;align-items:center;padding:6px 4px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line);margin-bottom:6px}
  .day-head .day-total{font-variant-numeric:tabular-nums;color:var(--txt);font-weight:600}
  .entry{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel2);border:1px solid transparent;border-radius:10px;margin-bottom:6px}
  .entry:hover{border-color:var(--line)}
  .entry .bar{width:4px;align-self:stretch;border-radius:3px}
  .entry .main{flex:1;min-width:0}
  .entry .title{font-weight:500}
  .entry .meta{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
  .chip{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
  .entry .dur{font-variant-numeric:tabular-nums;font-weight:600;min-width:74px;text-align:right}
  .entry .amt{font-variant-numeric:tabular-nums;color:var(--muted);min-width:80px;text-align:right;font-size:13px}
  .entry .acts{display:flex;gap:2px}
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
  .filters>div{min-width:130px}
  /* Filter/sort panel — visually distinct from entry forms */
  .filter-card{background:transparent;border:1px dashed var(--line);border-radius:var(--radius)}
  .filter-head{display:flex;align-items:center;gap:8px;font-family:var(--f-title);font-size:11px;font-weight:600;
    text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:14px}
  .filter-head svg{width:14px;height:14px;flex:none;stroke:var(--muted)}
  .filter-card label{text-transform:none}
  .filter-card input,.filter-card select{background:var(--bg)}
  .totbar{display:flex;gap:24px;flex-wrap:wrap;padding:12px 4px 2px;font-size:13px}
  .totbar b{font-size:18px;font-variant-numeric:tabular-nums;display:block}
  .muted{color:var(--muted)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px}
  th{color:var(--muted);font-weight:500}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .empty{text-align:center;color:var(--muted);padding:40px}
  /* View toggle + calendar */
  .seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{background:none;color:var(--muted);border-radius:0;padding:6px 14px;font-weight:500}
  .seg button:not(.active):hover{background:rgba(255,255,255,.06);color:var(--txt)}
  .seg button.active{background:var(--brand);color:#0a0c0d;font-weight:600}
  .seg button.active:hover{background:var(--brand)}
  .cal-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .cal-nav{display:flex;align-items:center;gap:8px}
  .cal-nav .weeklabel{font-weight:600;min-width:190px;text-align:center}
  .navbtn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);width:32px;height:32px;padding:0;border-radius:8px}
  .navbtn:hover{border-color:var(--accent);background:var(--panel2)}
  .cal{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
  .cal-head{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:7;background:var(--panel)}
  .cal-head .spacer{width:52px;flex:none}
  .cal-head .dh{flex:1;padding:6px 4px;text-align:center;font-size:12px;color:var(--muted);border-left:1px solid var(--line)}
  .cal-head .dh .dnum{font-size:17px;font-weight:600;color:var(--txt);line-height:1.1;font-family:var(--f-title)}
  .cal-head .dh.today .dnum{color:#0a0c0d;background:var(--brand);border-radius:50%;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;margin:2px auto 0}
  .cal-body{max-height:620px;overflow-y:auto;position:relative}
  .cal-canvas{display:flex;position:relative}
  .cal-hourcol{width:52px;flex:none}
  .cal-hourcol .hr{font-size:11px;color:var(--muted);text-align:right;padding-right:6px;transform:translateY(-6px)}
  .cal-daycol{flex:1;position:relative;border-left:1px solid var(--line);
    background-image:linear-gradient(var(--line) 1px,transparent 1px);background-repeat:repeat;cursor:crosshair}
  .cal-daycol.today{background-color:rgba(238,253,253,.04)}
  .ev{position:absolute;border-radius:6px;padding:3px 6px;overflow:hidden;cursor:pointer;font-size:11px;
    box-shadow:0 1px 2px rgba(0,0,0,.3);border-left:3px solid #fff}
  .ev:hover{filter:brightness(1.12);z-index:5}
  .ev .ev-t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
  .ev .ev-s{color:rgba(255,255,255,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nowline{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:6;pointer-events:none}
  .nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
  .list-item{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--panel2);border-radius:8px;margin-bottom:6px}
  .list-item .sw{width:12px;height:12px;border-radius:3px}
  .pill-rate{font-size:12px;color:var(--muted);margin-left:auto}
  /* Projects grouped by client */
  .proj-group{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
  .proj-group>.pg-head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel2);cursor:pointer;user-select:none}
  .proj-group>.pg-head .pg-name{font-family:var(--f-title);font-weight:600}
  .proj-group>.pg-head .pg-count{font-size:12px;color:var(--muted)}
  .proj-group>.pg-head .caret{margin-left:auto;color:var(--muted);transition:transform .15s}
  .proj-group.collapsed .caret{transform:rotate(-90deg)}
  .proj-group.collapsed .pg-body{display:none}
  .pg-body{padding:8px}
  .pg-body .list-item{background:var(--panel);border:1px solid var(--line)}
  .pg-body .proj-add{width:100%;justify-content:center;background:transparent;color:var(--muted);border:1px dashed var(--line)}
  .pg-body .proj-add:hover{color:var(--brand);border-color:var(--brand)}
  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;width:100%;max-width:460px}
  .modal h3{margin-bottom:14px}
  .modal .field{margin-bottom:12px}
  .modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}
  /* Print / PDF report */
  #report-print{display:none}
  @media print{
    body{background:#fff;color:#000;font-family:var(--f-body)}
    .wrap,.no-print{display:none !important}
    #report-print{display:block;padding:0;color:#000;font-size:12px}
    #report-print h1,#report-print h2,#report-print h3{font-family:var(--f-title)}
    #report-print h1{font-size:22px;margin:0}
    #report-print .em{font-family:var(--f-em);font-style:italic;color:#0a8a86;font-size:calc(1em + 2px)}
    #report-print table{width:100%;border-collapse:collapse}
    #report-print th,#report-print td{border-bottom:1px solid #ccc;padding:6px 8px}
    #report-print th{font-family:var(--f-title);text-align:left}
    #report-print .rp-brand{display:flex;align-items:center;gap:10px}
    #report-print .rp-brand .rp-logo{width:40px;height:40px;flex:none}
    #report-print .rp-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #000;padding-bottom:12px;margin-bottom:16px}
    #report-print .rp-tot{margin-top:16px;text-align:right;font-size:14px}
    @page{margin:18mm}
  }
  @media(max-width:820px){
    .timer{grid-template-columns:1fr 1fr;}
    .timer .desc{grid-column:1/3}
    .elapsed{grid-column:1/3}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1><span class="logo" id="brand-logo"></span> Tracking <span class="muted" style="font-size:12px;font-weight:400;align-self:center">v2.0</span></h1>
    <div class="row">
      <button class="ghost small" onclick="exportBackup()">Sauvegarde</button>
      <button class="ghost small" onclick="document.getElementById('importFile').click()">Importer</button>
      <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importBackup(event)">
    </div>
  </header>

  <!-- TIMER -->
  <div class="card">
    <div class="timer">
      <div class="desc">
        <label>Description</label>
        <input id="t-desc" placeholder="Sur quoi travailles-tu ?" style="width:100%">
      </div>
      <div>
        <label>Catégorie</label>
        <select id="t-cat" style="width:100%" onchange="onCatChange('t')"></select>
      </div>
      <div class="ctx" id="t-ctx">
        <div class="ctx-inner" id="t-clientwrap">
          <div style="flex:1"><label>Client</label><select id="t-client" style="width:100%" onchange="fillProjectSelect('t-project', this.value)"></select></div>
          <div style="flex:1"><label>Projet</label><select id="t-project" style="width:100%"></select></div>
        </div>
        <div id="t-typewrap" style="flex:1;display:none"><label>Type</label><select id="t-type" style="width:100%"></select></div>
      </div>
      <div class="elapsed" id="elapsed">00:00:00</div>
      <div><button id="startBtn" onclick="toggleTimer()" style="width:100%;height:38px">Démarrer</button></div>
    </div>
    <div class="hint" style="margin-top:8px">Le chrono tourne en direct. Tu peux aussi ajouter une entrée manuellement dans l'onglet Agenda.</div>
  </div>

  <div class="tabs">
    <button class="active" data-tab="agenda" onclick="switchTab('agenda')">Agenda</button>
    <button data-tab="manage" onclick="switchTab('manage')">Clients &amp; Projets</button>
    <button data-tab="report" onclick="switchTab('report')">Rapport / Export PDF</button>
  </div>

  <!-- AGENDA -->
  <section id="tab-agenda">
    <div class="card filter-card">
      <div class="filter-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
        Filtrer &amp; trier
      </div>
      <div class="filters">
        <div><label>Recherche</label><input id="f-search" oninput="renderAgenda()" placeholder="Description..."></div>
        <div><label>Catégorie</label><select id="f-cat"><option value="">Toutes</option></select></div>
        <div id="f-clientcol"><label>Client</label><select id="f-client" onchange="fillProjectSelect('f-project',this.value,true);renderAgenda()"><option value="">Tous</option></select></div>
        <div id="f-projectcol"><label>Projet</label><select id="f-project" onchange="renderAgenda()"><option value="">Tous</option></select></div>
        <div id="f-typecol" style="display:none"><label>Type</label><select id="f-ftype" onchange="renderAgenda()"><option value="">Tous</option></select></div>
        <div><label>Du</label><input type="date" id="f-from" onchange="renderAgenda()"></div>
        <div><label>Au</label><input type="date" id="f-to" onchange="renderAgenda()"></div>
        <div><label>Tri</label><select id="f-sort" onchange="renderAgenda()">
          <option value="date-desc">Date ↓</option><option value="date-asc">Date ↑</option>
          <option value="dur-desc">Durée ↓</option><option value="dur-asc">Durée ↑</option>
        </select></div>
        <div style="align-self:flex-end"><button class="ghost small" onclick="clearFilters()">Réinitialiser</button></div>
      </div>
      <div class="totbar" id="agenda-totals"></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap" class="no-print">
      <div class="seg">
        <button id="view-list" class="active" onclick="setAgendaView('list')">Liste</button>
        <button id="view-cal" onclick="setAgendaView('calendar')">Calendrier</button>
      </div>
      <button class="small" onclick="openEntryModal()">+ Ajouter une entrée</button>
    </div>

    <!-- Calendar toolbar (shown in calendar view) -->
    <div class="cal-toolbar no-print" id="cal-toolbar" style="display:none">
      <div class="cal-nav">
        <button class="navbtn" onclick="calShift(-1)" title="Précédent">‹</button>
        <button class="ghost small" onclick="calToday()">Aujourd'hui</button>
        <button class="navbtn" onclick="calShift(1)" title="Suivant">›</button>
        <span class="weeklabel" id="cal-label"></span>
      </div>
      <div class="seg">
        <button id="cal-week" class="active" onclick="setCalMode('week')">Semaine</button>
        <button id="cal-day" onclick="setCalMode('day')">Jour</button>
      </div>
    </div>

    <div id="agenda-list"></div>
    <div id="agenda-calendar" style="display:none"></div>
  </section>

  <!-- MANAGE -->
  <section id="tab-manage" style="display:none">
    <div class="grid2">
      <div class="card">
        <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:14px">
          <h3 style="margin:0">Clients</h3><button class="small" onclick="openClientModal()">+ Client</button>
        </div>
        <div id="clients-list"></div>
      </div>
      <div class="card">
        <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:14px">
          <h3 style="margin:0">Projets</h3><button class="small" onclick="openProjectModal()">+ Projet</button>
        </div>
        <div id="projects-list"></div>
      </div>
    </div>
  </section>

  <!-- REPORT -->
  <section id="tab-report" style="display:none">
    <div class="card">
      <h3>Générer un rapport facturable</h3>
      <div class="filters">
        <div><label>Client</label><select id="r-client" onchange="fillProjectSelect('r-project',this.value,true);renderReport()"><option value="">Tous</option></select></div>
        <div><label>Projet</label><select id="r-project" onchange="renderReport()"><option value="">Tous</option></select></div>
        <div><label>Catégorie</label><select id="r-cat" onchange="renderReport()"><option value="">Toutes</option></select></div>
        <div><label>Du</label><input type="date" id="r-from" onchange="renderReport()"></div>
        <div><label>Au</label><input type="date" id="r-to" onchange="renderReport()"></div>
        <div><label>Regrouper par</label><select id="r-group" onchange="renderReport()">
          <option value="entry">Chaque entrée</option><option value="project">Projet</option><option value="day">Jour</option>
        </select></div>
      </div>
      <div class="row" style="margin-top:12px;justify-content:space-between;align-items:center">
        <div class="row">
          <div><label>Ton nom / société</label><input id="r-from-name" placeholder="Ton nom" oninput="saveSettings()"></div>
          <div><label>Adressé à</label><input id="r-to-name" placeholder="Nom du client" oninput="renderReport()"></div>
        </div>
        <button onclick="printReport()">⬇ Exporter en PDF</button>
      </div>
    </div>
    <div class="card" id="report-preview"></div>
  </section>
</div>

<!-- Printable report -->
<div id="report-print"></div>

<div id="toast"></div>

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
/* ---------------- BRAND ---------------- */
const LOGO_SVG = '<svg viewBox="0 0 120.8 120.8" xmlns="http://www.w3.org/2000/svg"><circle cx="60.4" cy="60.4" r="60.4" fill="#fff"/><path d="M60.58,13.24l1.19,11.78c-.45-.02-.91-.02-1.35-.02s-.94,0-1.42.02l1.19-11.78s.1-.92.18-1.83c.1.92.18,1.83.18,1.83h.02Z"/><path d="M57.54,25.11c.49-.04.98-.06,1.46-.09l-1.1,10.84-2.84,27.85-1.15,11.32-.99,9.72-.29,2.88c-2.39,1.56-4.26,3.81-5.35,6.45l-4.4-2.08c-.33-.15-.65-.32-.96-.51-5.73-3.46-10.36-8.42-13.4-14.36-.03-.05-.06-.12-.09-.17-.06-.13-.13-.26-.18-.38-1.98-4.05-3.17-8.39-3.53-12.91-1.57-19.69,13.16-36.98,32.84-38.55Z"/><path d="M87.65,84.03c-3.87,4.55-8.71,7.99-14.12,10.11-1.05-2.56-2.83-4.78-5.15-6.37-.07-.05-.14-.1-.21-.14l-.29-2.89-1.57-15.33-1.86-18.24-.48-4.72-1.08-10.59-1.1-10.84c3.24.13,6.43.68,9.51,1.67,2.18.69,4.29,1.6,6.27,2.7.06.03.13.07.2.11.94.52,1.86,1.09,2.75,1.7,9.02,6.13,14.71,15.89,15.57,26.77.77,9.54-2.23,18.79-8.44,26.07Z"/><circle cx="60.4" cy="99.5" r="9.9" fill="#00fffb"/></svg>';

/* ---------------- DATA ---------------- */
const CATS = [
  {id:"Client",   label:"Client",   color:"var(--cat-client)"},
  {id:"Business", label:"Business", color:"var(--cat-business)"},
  {id:"Content",  label:"Content",  color:"var(--cat-content)"},
  {id:"Training", label:"Training", color:"var(--cat-training)"},
];
const CAT_COLOR = {Client:"#5b8cff",Business:"#f2a541",Content:"#2ec4b6",Training:"#c77dff"};
// Sub-types per category (Client uses client/project instead)
const CAT_TYPES = {
  Content:  ["Short","Long format","Statique"],
  Business: ["Comptabilité","Organisation","Facturation","Devis","Outils internes"],
  Training: ["Graphic design","Web design","Web development","Business","Développement personnel"],
};
const KEY = "timetracker_v1";
const PALETTE = ["#5b8cff","#f2a541","#2ec4b6","#c77dff","#ff7597","#57cc99","#ffd166","#4cc9f0","#f77f00","#90be6d"];

let data = load();
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY));
    if(d && d.entries) return d;
  }catch(e){}
  return {clients:[], projects:[], entries:[], running:null, settings:{fromName:""}};
}
function save(){ localStorage.setItem(KEY, JSON.stringify(data)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ---------------- HELPERS ---------------- */
function fmtDur(sec){
  sec=Math.max(0,Math.round(sec));
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  return String(h).padStart(2,'0')+":"+String(m).padStart(2,'0')+":"+String(s).padStart(2,'0');
}
function fmtHM(sec){
  sec=Math.max(0,Math.round(sec));
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60);
  return h+"h"+String(m).padStart(2,'0');
}
function decimalH(sec){ return sec/3600; }
function eur(n){ return n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+" €"; }
function clientName(id){ const c=data.clients.find(c=>c.id===id); return c?c.name:"—"; }
function projectById(id){ return data.projects.find(p=>p.id===id); }
function projectName(id){ const p=projectById(id); return p?p.name:"—"; }
function localDate(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0'); }
function dayKey(iso){ return localDate(new Date(iso)); }
function fmtDayLabel(key){
  const d=new Date(key+"T00:00:00");
  return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
function startOfWeek(d){ const x=new Date(d); const wd=(x.getDay()+6)%7; x.setDate(x.getDate()-wd); x.setHours(0,0,0,0); return x; } // Monday
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function entryDuration(e){ return e.duration; }
function entryAmount(e){
  const p=projectById(e.projectId);
  if(p && p.rate!=null && p.rate!=="") return decimalH(e.duration)*Number(p.rate);
  return null;
}

/* ---------------- TIMER ---------------- */
let tickInt=null;
function toggleTimer(){
  if(data.running){
    const r=data.running;
    const end=new Date().toISOString();
    const dur=(Date.now()-new Date(r.startedAt).getTime())/1000;
    data.entries.push({id:uid(),description:r.description||"(sans titre)",category:r.category,
      clientId:r.clientId||"",projectId:r.projectId||"",type:r.type||"",start:r.startedAt,end,duration:dur});
    data.running=null; save();
    stopTick(); document.getElementById('elapsed').textContent="00:00:00";
    document.getElementById('startBtn').textContent="Démarrer";
    document.getElementById('startBtn').style.background="";
    document.getElementById('t-desc').value="";
    renderAll();
  }else{
    const cat=document.getElementById('t-cat').value;
    const isClient=cat==='Client';
    data.running={
      description:document.getElementById('t-desc').value.trim(),
      category:cat,
      clientId:isClient?document.getElementById('t-client').value:"",
      projectId:isClient?document.getElementById('t-project').value:"",
      type:isClient?"":document.getElementById('t-type').value,
      startedAt:new Date().toISOString()
    };
    save(); startTick();
    document.getElementById('startBtn').textContent="Arrêter";
    document.getElementById('startBtn').style.background="var(--danger)";
  }
}
function startTick(){
  stopTick();
  tickInt=setInterval(()=>{
    if(!data.running) return;
    const sec=(Date.now()-new Date(data.running.startedAt).getTime())/1000;
    document.getElementById('elapsed').textContent=fmtDur(sec);
  },500);
}
function stopTick(){ if(tickInt) clearInterval(tickInt); tickInt=null; }
function restoreRunning(){
  if(data.running){
    document.getElementById('t-desc').value=data.running.description||"";
    document.getElementById('t-cat').value=data.running.category||CATS[0].id;
    document.getElementById('t-client').value=data.running.clientId||"";
    fillProjectSelect('t-project',data.running.clientId||"");
    document.getElementById('t-project').value=data.running.projectId||"";
    onCatChange('t');
    if(data.running.type){ const ts=document.getElementById('t-type'); if([...ts.options].some(o=>o.value===data.running.type)) ts.value=data.running.type; }
    document.getElementById('startBtn').textContent="Arrêter";
    document.getElementById('startBtn').style.background="var(--danger)";
    startTick();
  }
}
/* Toast + external URL trigger (Notion button / iOS Shortcut / Mac shortcut) */
function showToast(msg, stopped){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.toggle('stopped',!!stopped); t.classList.add('show');
  clearTimeout(showToast._t); showToast._t=setTimeout(()=>t.classList.remove('show'),3500);
}
function findByName(list,name){ name=(name||'').trim().toLowerCase(); return list.find(x=>(x.name||'').toLowerCase()===name); }
// Supported: ?action=start|stop|toggle  &desc=  &cat=Client|Business|Content|Training  &client=  &project=  &type=
function handleUrlTrigger(){
  const p=new URLSearchParams(location.search);
  const action=(p.get('action')||'').toLowerCase();
  if(!['start','stop','toggle'].includes(action)) return;
  if(!data.running){ // only prefill when we're about to start
    if(p.has('desc')) document.getElementById('t-desc').value=p.get('desc');
    if(p.has('cat') && CATS.some(c=>c.id===p.get('cat'))){ document.getElementById('t-cat').value=p.get('cat'); onCatChange('t'); }
    const cat=document.getElementById('t-cat').value;
    if(cat==='Client'){
      if(p.has('client')){ const cl=findByName(data.clients,p.get('client')); if(cl){ document.getElementById('t-client').value=cl.id; fillProjectSelect('t-project',cl.id); } }
      if(p.has('project')){ const selCl=document.getElementById('t-client').value;
        const pr=data.projects.find(x=>(x.name||'').toLowerCase()===p.get('project').trim().toLowerCase() && (!selCl||x.clientId===selCl));
        if(pr) document.getElementById('t-project').value=pr.id; }
    }else if(p.has('type')){
      fillTypeSelect('t-type',cat);
      const opt=[...document.getElementById('t-type').options].find(o=>o.value.toLowerCase()===p.get('type').trim().toLowerCase());
      if(opt) document.getElementById('t-type').value=opt.value;
    }
  }
  const wasRunning=!!data.running;
  if(action==='start' && wasRunning){ showToast('⏱ Un tracking est déjà en cours'); }
  else if(action==='stop' && !wasRunning){ showToast('Aucun tracking en cours', true); }
  else { toggleTimer(); }
  if(data.running){ const dsc=document.getElementById('t-desc').value; showToast('⏱ Tracking démarré'+(dsc?' — '+dsc:'')); }
  else if(wasRunning){ showToast('⏹ Tracking arrêté et enregistré', true); }
  // clean the query string so a manual refresh doesn't re-trigger
  if(history.replaceState) history.replaceState(null,'',location.pathname);
}

/* ---------------- SELECTS ---------------- */
function fillCatSelect(sel, includeAll){
  const el=document.getElementById(sel); const cur=el.value;
  el.innerHTML=(includeAll?'<option value="">Toutes</option>':'')+
    CATS.map(c=>`<option value="${c.id}">${c.label}</option>`).join('');
  if(cur) el.value=cur; // keep first option (Client) selected on the timer, which has no empty option
}
function fillClientSelect(sel, includeAll, allLabel){
  const el=document.getElementById(sel); const cur=el.value;
  el.innerHTML=(includeAll?`<option value="">${allLabel||'Tous'}</option>`:'<option value="">— Aucun —</option>')+
    data.clients.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  el.value=cur;
}
function fillTypeSelect(selId, category){
  const el=document.getElementById(selId); if(!el) return;
  const types=CAT_TYPES[category]||[]; const cur=el.value;
  el.innerHTML=types.map(t=>`<option value="${t}">${t}</option>`).join('');
  if(types.includes(cur)) el.value=cur;
}
// prefix 't' (timer) or 'm' (modal): show client/project for Client, else show Type
function setDisp(id, show){ const el=document.getElementById(id); if(el) el.style.display = show ? '' : 'none'; }
function onCatChange(prefix){
  const catEl=document.getElementById(prefix+'-cat'); if(!catEl) return;
  const isClient=(catEl.value==='Client');
  setDisp(prefix+'-clientwrap', isClient);   // direct inline style, no CSS-class dependency
  setDisp(prefix+'-typewrap', !isClient);
  if(!isClient) fillTypeSelect(prefix+'-type', catEl.value);
}
function fillProjectSelect(sel, clientId, includeAll){
  const el=document.getElementById(sel); if(!el) return; const cur=el.value;
  let list=data.projects;
  if(clientId) list=list.filter(p=>p.clientId===clientId);
  el.innerHTML=(includeAll?'<option value="">Tous</option>':'<option value="">— Aucun —</option>')+
    list.map(p=>`<option value="${p.id}">${p.name}${p.rate!=null&&p.rate!==""?' ('+p.rate+'€/h)':''}</option>`).join('');
  if(list.some(p=>p.id===cur)) el.value=cur; else el.value="";
}

/* ---------------- FILTERS ---------------- */
function passesFilters(e){
  const q=document.getElementById('f-search').value.toLowerCase();
  const cat=document.getElementById('f-cat').value;
  const cl=document.getElementById('f-client').value;
  const pr=document.getElementById('f-project').value;
  const ft=document.getElementById('f-ftype').value;
  if(q && !(e.description||"").toLowerCase().includes(q)) return false;
  if(cat && e.category!==cat) return false;
  if(cl && e.clientId!==cl) return false;
  if(pr && e.projectId!==pr) return false;
  if(ft && e.type!==ft) return false;
  return true;
}
// Filter bar: for a specific non-Client category, swap Client/Projet filters for a Type filter
function fillFilterTypeSelect(cat){
  const el=document.getElementById('f-ftype'); const cur=el.value;
  const types=CAT_TYPES[cat]||[];
  el.innerHTML='<option value="">Tous</option>'+types.map(t=>`<option value="${t}">${t}</option>`).join('');
  el.value=types.includes(cur)?cur:'';
}
function onFilterCatChange(){
  const cat=document.getElementById('f-cat').value;
  const typeMode=(cat && cat!=='Client');
  setDisp('f-clientcol', !typeMode);
  setDisp('f-projectcol', !typeMode);
  setDisp('f-typecol', typeMode);
  if(typeMode){
    fillFilterTypeSelect(cat);
    document.getElementById('f-client').value='';
    document.getElementById('f-project').value='';
  } else {
    document.getElementById('f-ftype').value='';
  }
  renderAgenda();
}
function getFiltered(){
  const from=document.getElementById('f-from').value;
  const to=document.getElementById('f-to').value;
  const sort=document.getElementById('f-sort').value;
  let list=data.entries.filter(e=>{
    if(!passesFilters(e)) return false;
    const dk=dayKey(e.start);
    if(from && dk<from) return false;
    if(to && dk>to) return false;
    return true;
  });
  list.sort((a,b)=>{
    if(sort==="date-asc") return a.start<b.start?-1:1;
    if(sort==="dur-desc") return b.duration-a.duration;
    if(sort==="dur-asc") return a.duration-b.duration;
    return a.start>b.start?-1:1;
  });
  return list;
}
function clearFilters(){
  ['f-search','f-cat','f-client','f-project','f-from','f-to','f-ftype'].forEach(id=>document.getElementById(id).value="");
  fillProjectSelect('f-project','',true);
  onFilterCatChange(); // restores Client/Projet columns + re-renders
}

/* ---------------- RENDER AGENDA ---------------- */
function renderAgenda(){
  const list=getFiltered();
  const box=document.getElementById('agenda-list');
  // totals
  let totSec=0, totAmt=0, hasAmt=false;
  list.forEach(e=>{ totSec+=e.duration; const a=entryAmount(e); if(a!=null){totAmt+=a;hasAmt=true;} });
  const catTot={};
  list.forEach(e=>{ catTot[e.category]=(catTot[e.category]||0)+e.duration; });
  let tb=`<div><span class="muted">Total</span><b>${fmtHM(totSec)}</b></div>`;
  CATS.forEach(c=>{ if(catTot[c.id]) tb+=`<div><span class="muted"><span class="cat-dot" style="background:${c.color}"></span>${c.label}</span><b>${fmtHM(catTot[c.id])}</b></div>`; });
  if(hasAmt) tb+=`<div><span class="muted">Montant facturable</span><b>${eur(totAmt)}</b></div>`;
  document.getElementById('agenda-totals').innerHTML=tb;

  if(!list.length){ box.innerHTML='<div class="empty">Aucune entrée. Lance le chrono ou ajoute une entrée manuellement.</div>'; return; }
  // group by day
  const groups={};
  list.forEach(e=>{ const k=dayKey(e.start); (groups[k]=groups[k]||[]).push(e); });
  const keys=Object.keys(groups).sort((a,b)=> document.getElementById('f-sort').value==="date-asc"?(a<b?-1:1):(a>b?-1:1));
  let html="";
  keys.forEach(k=>{
    const items=groups[k];
    const dsec=items.reduce((s,e)=>s+e.duration,0);
    html+=`<div class="day-group"><div class="day-head"><span>${fmtDayLabel(k)}</span><span class="day-total">${fmtHM(dsec)}</span></div>`;
    items.forEach(e=>{
      const amt=entryAmount(e);
      const col=CAT_COLOR[e.category]||"#888";
      html+=`<div class="entry">
        <div class="bar" style="background:${col}"></div>
        <div class="main">
          <div class="title">${escapeHtml(e.description||"(sans titre)")}</div>
          <div class="meta">
            <span class="chip"><span class="cat-dot" style="background:${col}"></span>${e.category}</span>
            ${e.category!=='Client'&&e.type?`<span class="chip">🏷 ${escapeHtml(e.type)}</span>`:''}
            ${e.clientId?`<span class="chip">👤 ${escapeHtml(clientName(e.clientId))}</span>`:''}
            ${e.projectId?`<span class="chip">🏷 ${escapeHtml(projectName(e.projectId))}</span>`:''}
            <span>${new Date(e.start).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</span>
          </div>
        </div>
        <div class="amt">${amt!=null?eur(amt):''}</div>
        <div class="dur">${fmtHM(e.duration)}</div>
        <div class="acts no-print">
          <button class="danger small" onclick="editEntry('${e.id}')" title="Modifier">✎</button>
          <button class="danger small" onclick="deleteEntry('${e.id}')" title="Supprimer">🗑</button>
        </div>
      </div>`;
    });
    html+=`</div>`;
  });
  box.innerHTML=html;
}
function escapeHtml(s){ return (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------------- CALENDAR VIEW ---------------- */
let agendaView="list";       // 'list' | 'calendar'
let calMode="week";          // 'week' | 'day'
let calRef=new Date();       // any date within the displayed period
const HH=44;                 // pixel height per hour
const START_H=0, END_H=24;   // hours shown

function setAgendaView(v){
  agendaView=v;
  document.getElementById('view-list').classList.toggle('active',v==='list');
  document.getElementById('view-cal').classList.toggle('active',v==='calendar');
  document.getElementById('agenda-list').style.display = v==='list'?'block':'none';
  document.getElementById('agenda-calendar').style.display = v==='calendar'?'block':'none';
  document.getElementById('cal-toolbar').style.display = v==='calendar'?'flex':'none';
  if(v==='calendar') renderCalendar();
}
function setCalMode(m){
  calMode=m;
  document.getElementById('cal-week').classList.toggle('active',m==='week');
  document.getElementById('cal-day').classList.toggle('active',m==='day');
  renderCalendar();
}
function calShift(dir){ calRef=addDays(calRef, dir*(calMode==='week'?7:1)); renderCalendar(); }
function calToday(){ calRef=new Date(); renderCalendar(); }

function layoutDay(evs){ // assign lane/lanes to overlapping events
  evs.sort((a,b)=> a._s-b._s || a._e-b._e);
  let cluster=[], clusterEnd=-1;
  const flush=()=>{
    const cols=[];
    cluster.forEach(ev=>{
      let placed=false;
      for(let i=0;i<cols.length;i++){ if(cols[i]<=ev._s){ ev._lane=i; cols[i]=ev._e; placed=true; break; } }
      if(!placed){ ev._lane=cols.length; cols.push(ev._e); }
    });
    cluster.forEach(ev=>ev._lanes=cols.length);
    cluster=[];
  };
  evs.forEach(ev=>{
    if(cluster.length && ev._s>=clusterEnd){ flush(); clusterEnd=-1; }
    cluster.push(ev); clusterEnd=Math.max(clusterEnd,ev._e);
  });
  flush();
  return evs;
}
function renderCalendar(){
  const days = calMode==='week'
    ? Array.from({length:7},(_,i)=>addDays(startOfWeek(calRef),i))
    : [new Date(calRef)];
  // label
  const lab=document.getElementById('cal-label');
  if(calMode==='week'){
    const a=days[0], b=days[6];
    lab.textContent = a.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+" – "+
                      b.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});
  }else{
    lab.textContent = days[0].toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  }
  const todayKey=localDate(new Date());
  // header
  let head='<div class="cal-head"><div class="spacer"></div>';
  days.forEach(d=>{
    const isToday=localDate(d)===todayKey;
    head+=`<div class="dh ${isToday?'today':''}">${d.toLocaleDateString('fr-FR',{weekday:'short'})}<div class="dnum">${d.getDate()}</div></div>`;
  });
  head+='</div>';
  // hour column
  let hours='<div class="cal-hourcol">';
  for(let h=START_H;h<END_H;h++){ hours+=`<div class="hr" style="height:${HH}px">${h?String(h).padStart(2,'0')+":00":''}</div>`; }
  hours+='</div>';
  // day columns
  const totalH=(END_H-START_H)*HH;
  let cols='';
  days.forEach(d=>{
    const dk=localDate(d);
    const isToday=dk===todayKey;
    // events of this day passing filters
    let evs=data.entries.filter(e=>passesFilters(e) && dayKey(e.start)===dk).map(e=>{
      const s=new Date(e.start);
      let sMin=s.getHours()*60+s.getMinutes();
      let eMin=sMin+Math.round(e.duration/60);
      if(eMin>END_H*60) eMin=END_H*60;
      return {...e,_s:sMin,_e:Math.max(eMin,sMin+1)};
    });
    layoutDay(evs);
    let blocks='';
    evs.forEach(ev=>{
      const top=(ev._s-START_H*60)/60*HH;
      const height=Math.max((ev._e-ev._s)/60*HH,16);
      const w=100/ev._lanes, left=ev._lane*w;
      const col=CAT_COLOR[ev.category]||'#888';
      const cl=ev.clientId?clientName(ev.clientId):'';
      const pr=ev.projectId?projectName(ev.projectId):'';
      const sub = ev.category==='Client' ? [pr,cl].filter(Boolean).join(' · ') : (ev.type||'');
      blocks+=`<div class="ev" style="top:${top}px;height:${height}px;left:calc(${left}% + 1px);width:calc(${w}% - 3px);background:${col};border-left-color:${shade(col)}"
        onclick="event.stopPropagation();editEntry('${ev.id}')" title="${escapeHtml(ev.description)} — ${fmtHM(ev.duration)}">
        <div class="ev-t">${escapeHtml(ev.description||'(sans titre)')}</div>
        <div class="ev-s">${fmtHM(ev.duration)}${sub?' · '+escapeHtml(sub):''}</div></div>`;
    });
    // now line
    let now='';
    if(isToday){
      const n=new Date(); const nMin=n.getHours()*60+n.getMinutes();
      if(nMin>=START_H*60 && nMin<=END_H*60) now=`<div class="nowline" style="top:${(nMin-START_H*60)/60*HH}px"></div>`;
    }
    cols+=`<div class="cal-daycol ${isToday?'today':''}" style="height:${totalH}px;background-size:100% ${HH}px"
      onclick="calCellClick(event,'${dk}')">${blocks}${now}</div>`;
  });
  document.getElementById('agenda-calendar').innerHTML=
    `<div class="cal"><div class="cal-body">${head}<div class="cal-canvas">${hours}${cols}</div></div></div>`;
  // scroll to 8h on first paint
  const body=document.querySelector('#agenda-calendar .cal-body');
  if(body && !body.dataset.scrolled){ body.scrollTop=(8-START_H)*HH; body.dataset.scrolled="1"; }
}
function calCellClick(ev,dk){
  const col=ev.currentTarget;
  const y=ev.clientY-col.getBoundingClientRect().top;
  let min=Math.round((y/HH*60)/15)*15 + START_H*60;
  min=Math.max(0,Math.min(23*60+45,min));
  const t=String(Math.floor(min/60)).padStart(2,'0')+":"+String(min%60).padStart(2,'0');
  openEntryModal(null,{date:dk,time:t});
}
function shade(hex){ // darker border tint
  const c=hex.replace('#',''); const n=parseInt(c,16);
  let r=(n>>16)-30, g=((n>>8)&255)-30, b=(n&255)-30;
  r=Math.max(0,r);g=Math.max(0,g);b=Math.max(0,b);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

      <div class="field"><label>Heure de fin</label><input type="time" id="m-end" style="width:100%" value="${endVal}" oninput="syncFromTimes()"></div>
    </div>
    <div class="field"><label>Durée (minutes)</label><input type="number" id="m-dur" min="0" step="1" style="width:100%" value="${durMin}" oninput="syncFromDuration()">
      <div class="hint">Modifie l'heure de fin ou la durée : les deux se synchronisent.</div></div>
    <div class="actions">
      <button class="ghost" onclick="closeModal()">Annuler</button>
      <button onclick="saveEntry(${isEdit?`'${entry.id}'`:'null'})">Enregistrer</button>
    </div>`;
  showModal();
  // Bind the category handler in JS (robust: not reliant on inline onchange in injected HTML)
  const mcat=document.getElementById('m-cat');
  mcat.addEventListener('change',()=>onCatChange('m'));
  mcat.addEventListener('input',()=>onCatChange('m'));
  fillProjectSelect('m-project', entry?entry.clientId:'');
  if(entry) document.getElementById('m-project').value=entry.projectId||"";
  onCatChange('m'); // toggles client/project vs type + fills type options
  if(entry && entry.type){ const ts=document.getElementById('m-type'); if([...ts.options].some(o=>o.value===entry.type)) ts.value=entry.type; }
}
function minutesBetween(t1,t2){ // handles crossing midnight
  const [h1,m1]=t1.split(':').map(Number), [h2,m2]=t2.split(':').map(Number);
  let d=(h2*60+m2)-(h1*60+m1); if(d<0) d+=1440; return d;
}
function syncFromTimes(){
  const t=document.getElementById('m-time').value, e=document.getElementById('m-end').value;
  if(!t||!e) return;
  document.getElementById('m-dur').value=minutesBetween(t,e);
}
function syncFromDuration(){
  const t=document.getElementById('m-time').value; if(!t) return;
  const dur=Number(document.getElementById('m-dur').value)||0;
  const [h,m]=t.split(':').map(Number);
  const tot=(h*60+m+dur)%1440;
  document.getElementById('m-end').value=String(Math.floor(tot/60)).padStart(2,'0')+":"+String(tot%60).padStart(2,'0');
}
function saveEntry(id){
  const desc=document.getElementById('m-desc').value.trim();
  const cat=document.getElementById('m-cat').value;

  const clientId=isClient?document.getElementById('m-client').value:"";
  const projectId=isClient?document.getElementById('m-project').value:"";
  const type=isClient?"":document.getElementById('m-type').value;
  const date=document.getElementById('m-date').value;
  const time=document.getElementById('m-time').value||"00:00";
  const durMin=Number(document.getElementById('m-dur').value)||0;
  const start=new Date(date+"T"+time);
  const duration=durMin*60;
  const end=new Date(start.getTime()+duration*1000);
  if(id){
    const e=data.entries.find(x=>x.id===id);
    Object.assign(e,{description:desc||"(sans titre)",category:cat,clientId,projectId,type,start:start.toISOString(),end:end.toISOString(),duration});
  }else{
    data.entries.push({id:uid(),description:desc||"(sans titre)",category:cat,clientId,projectId,type,start:start.toISOString(),end:end.toISOString(),duration});
  }
  save(); closeModal(); renderAll();
}

function onClientLogo(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    // downscale raster images to keep storage small; pass SVG through
    if(f.type==='image/svg+xml'){ _clientLogoTmp=r.result; refreshLogoPreview(); return; }
    const img=new Image();
    img.onload=()=>{
      const S=128, cv=document.createElement('canvas'); cv.width=S; cv.height=S;
      const ctx=cv.getContext('2d');
      const scale=Math.min(S/img.width,S/img.height); // "fit": whole logo visible
      const w=img.width*scale, h=img.height*scale;
      ctx.drawImage(img,(S-w)/2,(S-h)/2,w,h);
      _clientLogoTmp=cv.toDataURL('image/png');
      refreshLogoPreview();
    };
    img.src=r.result;
  };
  r.readAsDataURL(f);
}

/* ---------------- REPORT / PDF ---------------- */
function getReportEntries(){
  const cl=document.getElementById('r-client').value;
  const pr=document.getElementById('r-project').value;
  const cat=document.getElementById('r-cat').value;
  const from=document.getElementById('r-from').value;
  const to=document.getElementById('r-to').value;
  return data.entries.filter(e=>{
    if(cl && e.clientId!==cl) return false;
    if(pr && e.projectId!==pr) return false;
    if(cat && e.category!==cat) return false;
    const dk=dayKey(e.start);
    if(from && dk<from) return false;
    if(to && dk>to) return false;
    return true;
  }).sort((a,b)=>a.start<b.start?-1:1);
}
function buildReportRows(list){
  const group=document.getElementById('r-group').value;
  if(group==="entry"){
    return list.map(e=>({label:e.description||"(sans titre)",
      sub:(e.category==='Client'?projectName(e.projectId):(e.type||e.category))+" · "+e.category,
      date:dayKey(e.start), sec:e.duration, amt:entryAmount(e)}));
  }
  const map={};
  list.forEach(e=>{
    const k= group==="project"? (e.projectId||"__none") : dayKey(e.start);
    if(!map[k]) map[k]={label: group==="project"?projectName(e.projectId):fmtDayLabel(dayKey(e.start)), sub:"", date: group==="day"?dayKey(e.start):"", sec:0, amt:null, anyRate:false};
    map[k].sec+=e.duration;
    const a=entryAmount(e);
    if(a!=null){ map[k].amt=(map[k].amt||0)+a; map[k].anyRate=true; }
  });
  return Object.values(map);
}
function renderReport(){
  const list=getReportEntries();
  const rows=buildReportRows(list);
  const totSec=list.reduce((s,e)=>s+e.duration,0);
  let totAmt=0, hasAmt=false;
  list.forEach(e=>{ const a=entryAmount(e); if(a!=null){totAmt+=a;hasAmt=true;} });
  const prev=document.getElementById('report-preview');
  if(!list.length){ prev.innerHTML='<div class="empty">Aucune entrée pour ces critères.</div>'; return; }
  let h=`<table><thead><tr><th>Détail</th><th>Date</th><th class="num">Heures</th>${hasAmt?'<th class="num">Montant</th>':''}</tr></thead><tbody>`;
  rows.forEach(r=>{
    h+=`<tr><td>${escapeHtml(r.label)}${r.sub?`<br><span class="muted" style="font-size:12px">${escapeHtml(r.sub)}</span>`:''}</td>
      <td>${r.date||''}</td><td class="num">${fmtHM(r.sec)}</td>${hasAmt?`<td class="num">${r.amt!=null?eur(r.amt):'—'}</td>`:''}</tr>`;
  });
  h+=`</tbody></table><div class="totbar"><div><span class="muted">Total heures</span><b>${fmtHM(totSec)} (${decimalH(totSec).toFixed(2)}h)</b></div>`;
  if(hasAmt) h+=`<div><span class="muted">Total à facturer</span><b>${eur(totAmt)}</b></div>`;
  h+=`</div>`;
  prev.innerHTML=h;
}
function printReport(){
  const list=getReportEntries();
  if(!list.length){ alert("Aucune entrée à exporter."); return; }
  const rows=buildReportRows(list);
  const totSec=list.reduce((s,e)=>s+e.duration,0);

      <div style="text-align:right">${fromName?`<div><strong>${escapeHtml(fromName)}</strong></div>`:''}${toName?`<div>Pour : ${escapeHtml(toName)}</div>`:''}<div style="color:#666">Édité le ${new Date().toLocaleDateString('fr-FR')}</div></div>

  CLIENTS.forEach((name,i)=>{
    const cid=uid();
    data.clients.push({id:cid, name, color:PALETTE[i%PALETTE.length]});
    PROJ_TYPES.forEach(pt=>{
      data.projects.push({id:uid(), name:pt.name, clientId:cid, rate:null, color:pt.color});
    });
  });
  save();
}
if(!data.clients.length && !data.projects.length){ seedDefaults(); }

// inject brand logo + favicon
document.getElementById('brand-logo').innerHTML=LOGO_SVG;
document.getElementById('favicon').href='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(LOGO_SVG)));

document.getElementById('r-from-name').value=(data.settings&&data.settings.fromName)||"";
refreshSelects();
onCatChange('t'); // set initial timer field visibility for the default category
document.getElementById('f-cat').addEventListener('change', onFilterCatChange); // filter: Client/Projet <-> Type
renderAll();
setAgendaView('calendar'); // Calendrier actif par défaut
restoreRunning();
handleUrlTrigger(); // start/stop/toggle from an external button (Notion, iOS Shortcut, Mac shortcut)
</script>
</body>
