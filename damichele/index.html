<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue Dot — Offre Da Michele</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=Crimson+Pro:ital,wght@0,400;1,400;1,500;1,600&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
/* =========================================================
   BLUE DOT — Offre interactive (template réutilisable)
   Tout est piloté par l'objet CONFIG en bas du fichier.
   ========================================================= */
:root{
  --bg:#000000;
  --ink:#ffffff;
  --muted:#8a8f98;
  --muted-2:#5a5f68;
  --cyan:#1fe3de;          /* accent Blue Dot */
  --cyan-dim:rgba(31,227,222,.14);
  --line:rgba(255,255,255,.07);
  --line-2:rgba(255,255,255,.14);
  --card:#0b0c0e;
  --card-2:#0f1114;
  --radius:18px;
  --sans:'Space Grotesk',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --serif:'Crimson Pro',Georgia,serif;
  --mono:'Space Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--body);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
/* faint technical grid */
.grid-bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(var(--line) 1px,transparent 1px),
    linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(circle at 50% 40%,#000 55%,transparent 100%);
}
.glow{
  position:fixed;z-index:0;pointer-events:none;
  width:60vw;height:60vw;max-width:720px;max-height:720px;
  left:50%;top:8%;transform:translateX(-50%);
  background:radial-gradient(circle,rgba(31,227,222,.10),transparent 62%);
  filter:blur(20px);
}

/* ---------- top bar : progress ---------- */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;gap:18px;
  padding:20px clamp(18px,5vw,54px);
}
.brand{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.logo{
  width:38px;height:38px;border-radius:50%;background:#fff;
  display:grid;place-items:center;flex:0 0 auto;position:relative;overflow:hidden;
}
.logo img{width:80%;height:80%;object-fit:contain;display:block}
.brand-name{font-family:var(--sans);font-weight:600;font-size:15px;letter-spacing:.02em}
.progress-wrap{flex:1;display:flex;align-items:center;gap:14px;max-width:640px}
.progress-track{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden}
.progress-fill{height:100%;width:0;background:var(--cyan);border-radius:3px;transition:width .55s cubic-bezier(.5,.1,.1,1);box-shadow:0 0 12px rgba(31,227,222,.6)}
.step-count{font-family:var(--mono);font-size:12px;color:var(--muted);flex:0 0 auto;letter-spacing:.04em}
.tag-line{font-family:var(--mono);font-size:11px;color:var(--muted-2);flex:0 0 auto;display:none}
@media(min-width:900px){.tag-line{display:block}}

/* ---------- stage ---------- */
.stage{
  position:relative;z-index:10;height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:96px clamp(18px,5vw,54px) 108px;
}
.screen{
  width:100%;max-width:920px;display:none;
  animation:none;
}
.screen.active{display:block;animation:enter .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.screen-scroll{max-height:calc(100vh - 210px);overflow-y:auto;padding-right:6px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
.screen-scroll::-webkit-scrollbar{width:6px}
.screen-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:6px}

.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:20px}
h1.display{font-family:var(--sans);font-weight:600;font-size:clamp(38px,6.4vw,74px);line-height:1.02;letter-spacing:-.02em}
h2.title{font-family:var(--sans);font-weight:600;font-size:clamp(28px,4.4vw,50px);line-height:1.05;letter-spacing:-.02em;margin-bottom:8px}
/* accent italique : Crimson Pro, 4px plus grand que le Space Grotesk du même titre */
.it{font-family:var(--serif);font-style:italic;color:var(--cyan);font-weight:500;font-size:calc(1em + 4px);line-height:1}
.it-w{font-family:var(--serif);font-style:italic;font-weight:500}
.lede{font-size:clamp(15px,1.5vw,18px);line-height:1.62;color:#d7dade;max-width:70ch;margin-top:22px}
.lede+.lede{margin-top:16px}
.small{color:var(--muted);font-size:13px;line-height:1.6}

/* hero chips */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.chip{border:1px solid var(--line-2);border-radius:40px;padding:7px 16px;font-size:13px;color:#cfd3d8;font-family:var(--sans)}
.chip.mono{font-family:var(--mono);font-size:12px}

/* process list */
.proc{display:grid;gap:18px;margin-top:26px}
.proc-item{display:grid;grid-template-columns:44px 1fr;gap:16px;align-items:start;padding:16px 0;border-top:1px solid var(--line)}
.proc-item:first-child{border-top:0}
.pnum{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-family:var(--mono);font-size:14px;color:var(--cyan)}
.proc h3{font-family:var(--sans);font-size:17px;font-weight:600;margin-bottom:5px}
.proc p{font-size:14px;line-height:1.55;color:var(--muted)}

/* ---------- packs ---------- */
.packs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}
@media(max-width:820px){.packs{grid-template-columns:1fr}.screen-scroll{max-height:calc(100vh - 200px)}}
.pack{
  position:relative;text-align:left;cursor:pointer;
  background:var(--card);border:1px solid var(--line-2);border-radius:var(--radius);
  padding:22px 20px 20px;transition:.28s ease;overflow:hidden;
}
.pack:hover{border-color:rgba(255,255,255,.34);transform:translateY(-3px)}
.pack.selected{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 18px 50px -20px rgba(31,227,222,.5);background:linear-gradient(180deg,rgba(31,227,222,.06),transparent 60%),var(--card)}
.pack.reco{border-color:rgba(31,227,222,.4)}
.reco-badge{position:absolute;top:14px;right:14px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#001;background:var(--cyan);padding:4px 9px;border-radius:20px;font-weight:700}
.pack-name{font-family:var(--sans);font-size:22px;font-weight:600;margin-top:4px}
.pack-sub{color:var(--muted);font-size:13px;margin-top:4px;min-height:34px}
.pack-price{font-family:var(--sans);font-size:30px;font-weight:600;margin:16px 0 2px;letter-spacing:-.02em}
.pack-price small{font-size:13px;color:var(--muted);font-weight:400;font-family:var(--body)}
.pack-feats{list-style:none;margin-top:14px;display:grid;gap:9px}
.pack-feats li{display:flex;gap:9px;font-size:13.5px;color:#cfd3d8;line-height:1.35}
.pack-feats li .ck{color:var(--cyan);flex:0 0 auto;margin-top:1px}
.pack-feats li.off{color:var(--muted-2);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.2)}
.pack-feats li.off .ck{color:var(--muted-2)}
.pack-pick{margin-top:18px;display:flex;align-items:center;justify-content:space-between}
.pick-state{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pack.selected .pick-state{color:var(--cyan)}
.radio{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center}
.pack.selected .radio{border-color:var(--cyan)}
.pack.selected .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--cyan)}

/* detail / budget cards */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-top:22px}
.rows{display:grid;gap:2px;margin-top:8px}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px dashed var(--line-2)}
.row:last-child{border-bottom:0}
.row .rname{font-size:15px}
.row .rprice{font-family:var(--sans);font-size:15px;white-space:nowrap}
.row.total{border-top:1px solid var(--line-2);border-bottom:0;margin-top:6px;padding-top:16px}
.row.total .rname{font-weight:600;font-family:var(--sans)}
.row.total .rprice{font-size:22px;font-weight:600}
.tva{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:14px;text-align:right;margin-top:10px}

/* deliverable pill inside detail */
.deliv{display:inline-flex;gap:8px;align-items:center;font-size:12.5px;color:var(--cyan);font-family:var(--mono);margin-top:6px}

/* agenda timeline */
.timeline{margin-top:26px;position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1.5px;background:var(--line-2)}
.tl-item{position:relative;padding:0 0 22px}
.tl-item::before{content:"";position:absolute;left:-25px;top:4px;width:11px;height:11px;border-radius:50%;background:#000;border:1.5px solid var(--cyan)}
.tl-item.pay::before{background:var(--cyan)}
.tl-date{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.tl-label{font-family:var(--serif);font-style:italic;font-size:18px;margin-top:2px}
.tl-label.pay{font-family:var(--body);font-style:normal;font-size:14px;color:#cfd3d8}

/* toolbox */
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:28px}
@media(max-width:720px){.tools{grid-template-columns:repeat(2,1fr)}}
.tool{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 14px;text-align:center}
.tool .ic{font-size:26px}
.tool h4{font-family:var(--sans);font-size:14px;margin-top:10px}
.tool p{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.45}

/* form */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
@media(max-width:640px){.form-grid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea{
  background:var(--card-2);border:1px solid var(--line-2);border-radius:11px;
  padding:12px 14px;color:var(--ink);font-family:var(--body);font-size:14.5px;outline:none;transition:.2s;
}
.field input:focus,.field textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-dim)}

/* recap final banner */
.recap-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
.recap-total{font-family:var(--sans);font-size:34px;font-weight:600;letter-spacing:-.02em}
.recap-total .it{font-size:26px}

/* contact block */
.contact{display:grid;gap:8px;margin-top:6px}
.contact .c{display:flex;gap:10px;align-items:center;font-size:14px;color:#cfd3d8}
.contact .c .ic{color:var(--cyan);width:18px;text-align:center}

/* ---------- nav ---------- */
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:18px clamp(18px,5vw,54px);
  background:linear-gradient(0deg,#000 40%,transparent);
}
.btn{
  font-family:var(--sans);font-size:14px;font-weight:500;cursor:pointer;
  border:1px solid var(--line-2);background:transparent;color:var(--ink);
  padding:12px 22px;border-radius:40px;display:inline-flex;align-items:center;gap:10px;transition:.22s;
}
.btn:hover{border-color:#fff}
.btn:disabled{opacity:.32;cursor:not-allowed}
.btn.primary{background:var(--cyan);color:#001;border-color:var(--cyan);font-weight:600}
.btn.primary:hover{box-shadow:0 8px 30px -8px rgba(31,227,222,.7);border-color:var(--cyan)}
.btn.ghost{border:0}
.arrow{font-size:16px;transition:transform .2s}
.btn:hover .arrow{transform:translateX(3px)}
.hint{font-family:var(--mono);font-size:11px;color:var(--muted-2);letter-spacing:.04em}
@media(max-width:560px){.hint{display:none}}

/* ---------- édition directe dans le canvas ---------- */
body.editmode [data-edit]{border-radius:4px;transition:box-shadow .15s,background .15s}
body.editmode [data-edit]:hover{box-shadow:inset 0 -2px 0 rgba(31,227,222,.45);cursor:text}
body.editmode [data-edit]:focus{outline:none;box-shadow:inset 0 0 0 1px rgba(31,227,222,.6);background:rgba(31,227,222,.06)}
body.editmode .pack[role="button"]{cursor:default}
.edit-hint{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);z-index:35;display:none;
  font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:#001;background:var(--cyan);
  padding:7px 14px;border-radius:30px;box-shadow:0 8px 24px -8px rgba(31,227,222,.6)}
body.editmode .edit-hint{display:block}

/* ---------- éditeur (mini-CMS) ---------- */
#editFab{
  position:fixed;left:clamp(18px,5vw,54px);bottom:74px;z-index:40;display:none;
  align-items:center;gap:8px;font-family:var(--sans);font-size:13px;font-weight:600;
  background:var(--cyan);color:#001;border:0;border-radius:40px;padding:11px 18px;cursor:pointer;
  box-shadow:0 10px 30px -8px rgba(31,227,222,.6);
}
#editFab.on{display:inline-flex}
#previewExit{position:fixed;left:clamp(18px,5vw,54px);bottom:74px;z-index:40;display:none;
  align-items:center;gap:8px;font-family:var(--sans);font-size:13px;font-weight:600;
  background:#fff;color:#001;border:0;border-radius:40px;padding:11px 18px;cursor:pointer;
  box-shadow:0 10px 30px -8px rgba(255,255,255,.4)}
#editor{
  position:fixed;top:0;right:0;height:100vh;width:min(440px,94vw);z-index:60;
  background:#0a0b0d;border-left:1px solid var(--line-2);
  transform:translateX(102%);transition:transform .35s cubic-bezier(.4,.1,.1,1);
  display:flex;flex-direction:column;
}
#editor.open{transform:none;box-shadow:-30px 0 80px -30px rgba(0,0,0,.9)}
.ed-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);flex:0 0 auto}
.ed-head h3{font-family:var(--sans);font-size:15px;font-weight:600}
.ed-head .sub{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.06em}
.ed-actions{display:flex;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap}
.ed-btn{font-family:var(--sans);font-size:12px;font-weight:600;border:1px solid var(--line-2);background:transparent;color:var(--ink);padding:9px 13px;border-radius:9px;cursor:pointer;transition:.2s}
.ed-btn:hover{border-color:#fff}
.ed-btn.primary{background:var(--cyan);color:#001;border-color:var(--cyan)}
.ed-btn.x{margin-left:auto;border:0;font-size:20px;padding:2px 8px;color:var(--muted)}
.ed-body{overflow-y:auto;padding:10px 18px 40px;flex:1;scrollbar-width:thin}
.ed-body::-webkit-scrollbar{width:6px}.ed-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:6px}
.ed-sec{border-top:1px solid var(--line);margin-top:6px}
.ed-sec>summary{cursor:pointer;list-style:none;padding:14px 2px;font-family:var(--sans);font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.ed-sec>summary::-webkit-details-marker{display:none}
.ed-sec>summary::before{content:"▸";color:var(--cyan);font-size:11px;transition:.2s}
.ed-sec[open]>summary::before{transform:rotate(90deg)}
.ed-field{display:flex;flex-direction:column;gap:5px;margin:0 0 12px}
.ed-field label{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.ed-field input,.ed-field textarea{background:#101216;border:1px solid var(--line-2);border-radius:8px;padding:9px 11px;color:var(--ink);font-family:var(--body);font-size:13px;outline:none;width:100%}
.ed-field input:focus,.ed-field textarea:focus{border-color:var(--cyan)}
.ed-field textarea{resize:vertical;line-height:1.5}
.ed-row2{display:grid;grid-template-columns:1fr 96px;gap:8px}
.ed-card{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;background:#0c0e11}
.ed-card h4{font-family:var(--sans);font-size:12px;color:var(--cyan);margin-bottom:8px}
.ed-checks{display:flex;flex-wrap:wrap;gap:6px 12px}
.ed-check{display:flex;align-items:center;gap:6px;font-size:12px;color:#cfd3d8}
.ed-check input{width:auto}
.ed-mini{font-size:11px;color:var(--muted);margin:2px 0 10px;line-height:1.5}
.ed-del{background:transparent;border:1px solid var(--line-2);color:var(--muted);border-radius:7px;cursor:pointer;font-size:12px;padding:4px 9px}
.ed-add{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--cyan);background:transparent;border:1px dashed var(--line-2);border-radius:8px;padding:8px;width:100%;cursor:pointer}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);z-index:80;background:#fff;color:#000;font-family:var(--sans);font-size:13px;font-weight:600;padding:11px 20px;border-radius:40px;opacity:0;transition:.35s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- print / PDF recap ---------- */
.print-only{display:none}
@media print{
  @page{margin:18mm}
  html,body{overflow:visible;height:auto;background:#fff;color:#000}
  .grid-bg,.glow,.topbar,.nav,.stage{display:none!important}
  .print-only{display:block;position:static;color:#000;font-family:var(--body)}
  .p-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #000;padding-bottom:14px;margin-bottom:22px}
  .p-title{font-family:var(--sans);font-size:26px;font-weight:700}
  .p-sub{font-size:12px;color:#555;margin-top:4px}
  .p-meta{font-size:12px;text-align:right;line-height:1.7}
  .p-section-t{font-family:var(--sans);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.08em;margin:22px 0 8px;color:#111}
  .p-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #ddd;font-size:14px}
  .p-total{display:flex;justify-content:space-between;padding:12px 0 0;font-family:var(--sans);font-weight:700;font-size:18px}
  .p-note{font-style:italic;color:#666;font-size:12px;text-align:right;margin-top:6px}
  .p-info{font-size:13px;line-height:1.9;margin-top:8px}
  .p-foot{margin-top:26px;border-top:1px solid #000;padding-top:12px;font-size:11px;color:#555;display:flex;justify-content:space-between}
}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="glow"></div>

<!-- ===== TOP BAR ===== -->
<header class="topbar">

      "texte": "Ici, on met en application tout le travail réalisé en amont : plus les étapes précédentes sont précises, plus le site se développe vite et en parfaite cohérence avec ton univers.\n\nPour développer un site, deux voies existent : faire appel à un développeur qui transcrit le design en code, ou passer par un outil no-code / low-code (Webflow, Framer, Wix, WordPress…).\n\nLe choix dépend des besoins, mais dans la majorité des cas je préconise Webflow : un outil ultra-puissant, pensé pour un rendu réellement sur mesure. Il permet de travailler l'architecture en profondeur et de livrer un site rapide, léger et au code propre, un vrai plus pour le référencement et l'expérience utilisateur. Bonus : le code est exportable si tu veux un jour changer d'hébergeur.\n\nSa principale limite : on ne choisit pas son hébergeur (Webflow s'appuie sur les serveurs d'Amazon / AWS). Rien de bloquant, ils sont puissants et présents partout, mais c'est un point à connaître, surtout dans les secteurs sensibles en matière de données.\n\nDans ton cas, c'est probablement la solution que je retiendrai, tout en restant ouvert à la faire évoluer au fil de nos échanges pendant la stratégie et la maquette."
    },
    {
      "titre": "Suivi & formation",
      "texte": "Dans cette dernière phase, on prévoit en principe 3 semaines pour les derniers ajustements, s'assurer que tout fonctionne et, surtout, que tu puisses reprendre la main sur la suite du projet.\n\nQuelle que soit la plateforme choisie, je prends le temps de t'expliquer et de t'accompagner pour que tu sois réellement autonome. Si notre collaboration se prolonge, je peux gérer tout cela pour toi ; mais comme tu l'as évoqué, si tu dois un jour reprendre la main, une formation s'impose, notamment sur la gestion de la carte, des automatisations et du back-office.\n\nAu-delà de ça, cette période de battement est cruciale. Un projet comme celui-ci demande de la réflexion et des allers-retours : après plusieurs semaines plongé dans la refonte, prendre du recul permet de ne rien laisser passer. En un mot, le maître mot de notre collaboration : flexibilité.\n\nEt pour la suite, si l'aventure a été un succès, je reste évidemment disponible pour tes besoins futurs, on en reparlera en temps voulu, à l'issue de cette première étape."

const euro = n => Number(n||0).toLocaleString('fr-FR')+' '+(CONFIG.devise||'€');  // devise lue en direct
// titres éditables : *mot* => accent italique
const fmtTitle = s => (s||'').replace(/\*([^*]+)\*/g,'<span class="it">$1</span>');
const scEye = i => (CONFIG.screens&&CONFIG.screens[i]&&CONFIG.screens[i].eyebrow)||'';
const scTit = i => fmtTitle((CONFIG.screens&&CONFIG.screens[i]&&CONFIG.screens[i].title)||'');
const DEFAULT_SCREENS=(CONFIG.screens||[]).map(s=>({eyebrow:s.eyebrow,title:s.title}));  // titres par défaut du fichier

let previewMode=false;
function getPath(pp){const a=pp.split('.');let o=CONFIG;for(const k of a){if(o==null)return '';o=o[/^\d+$/.test(k)?+k:k];}return o==null?'':o;}
function ensurePlanning(){if(!CONFIG.planning)CONFIG.planning={};Object.keys(CONFIG.modules).forEach(k=>{if(!CONFIG.planning[k])CONFIG.planning[k]={date:''};});}
function ensurePaiements(){if(!CONFIG.paiements)CONFIG.paiements={};CONFIG.packs.forEach(p=>{if(!CONFIG.paiements[p.id])CONFIG.paiements[p.id]={};});}
// montants d'échéances calculés (% du prix), arrondis, dernier ajusté pour tomber juste
function computePayments(p){
  const total=packTotal(p), sched=(CONFIG.paiements&&CONFIG.paiements[p.id])||{};
  const keys=p.modules.filter(k=>sched[k]!==undefined&&sched[k]!==''&&Number(sched[k])>0);
  const out={}; let acc=0;
  keys.forEach(k=>{const m=Math.round(total*Number(sched[k])/100);out[k]=m;acc+=m;});
  if(keys.length){const sumPct=keys.reduce((s,k)=>s+Number(sched[k]),0);out[keys[keys.length-1]]+=Math.round(total*sumPct/100)-acc;}
  return out;
}
function EI(pp,opt){return (typeof editEnabled!=='undefined'&&editEnabled&&!previewMode)?` data-edit="${pp}"${opt&&opt.num?' data-num="1"':''}`:'';}
const hasOverride = v => v!==undefined && v!==null && String(v).trim()!=='' && !isNaN(Number(v));
const packTotal = p => hasOverride(p.prix) ? Number(p.prix) : p.modules.reduce((s,k)=>s+((CONFIG.modules[k]&&CONFIG.modules[k].prix)||0),0);

/* ---- navigation ---- */
let idx=0;
const stage=document.getElementById('stage');
const pfill=document.getElementById('pfill');
const scount=document.getElementById('scount');
const tagline=document.getElementById('tagline');
const backBtn=document.getElementById('back');
const nextBtn=document.getElementById('next');
const hint=document.getElementById('hint');
const TOTAL=screens.length;

function render(){
  ensurePlanning(); ensurePaiements();
  stage.innerHTML=`<section class="screen active">${screens[idx]()}</section>`;
  pfill.style.width=((idx+1)/TOTAL*100)+'%';
  scount.textContent=String(idx+1).padStart(2,'0')+' / '+String(TOTAL).padStart(2,'0');
  tagline.textContent=CONFIG.entreprise+' · '+CONFIG.discipline;
  backBtn.style.visibility=idx===0?'hidden':'visible';
  if(idx===0){nextBtn.innerHTML='Commencer <span class="arrow">→</span>';hint.textContent='Entrée ↵ pour continuer';}
  else if(idx===3){nextBtn.innerHTML='Voir le détail <span class="arrow">→</span>';hint.textContent='Choisis une formule';}
  else if(idx===TOTAL-1){nextBtn.innerHTML='⇩ Télécharger le récap (PDF)';hint.textContent='Génère un PDF imprimable';}
  else{nextBtn.innerHTML='Continuer <span class="arrow">→</span>';hint.textContent='Entrée ↵ pour continuer';}
  bind();
  makeInlineEditable();
}
function makeInlineEditable(){
  if(!editEnabled||previewMode)return;
  const eb=stage.querySelector('.eyebrow'); if(eb&&!eb.dataset.edit)eb.dataset.edit='screens.'+idx+'.eyebrow';
  const ti=stage.querySelector('.title,.display'); if(ti&&!ti.dataset.edit)ti.dataset.edit='screens.'+idx+'.title';
  stage.querySelectorAll('[data-edit]').forEach(el=>{el.setAttribute('contenteditable','plaintext-only');el.setAttribute('spellcheck','false');});
}
function bind(){
  // pack selection (ignore les clics sur un élément éditable)
  document.querySelectorAll('.pack[data-pack]').forEach(el=>{
    const pick=(e)=>{if(e&&e.target.closest('[data-edit]'))return;selectedPack=el.dataset.pack;render();};
    el.addEventListener('click',pick);
    el.addEventListener('keydown',e=>{if(!editEnabled&&(e.key==='Enter'||e.key===' ')){e.preventDefault();pick();}});
  });
  // form capture
  document.querySelectorAll('[data-k]').forEach(inp=>{
    inp.value=client[inp.dataset.k]||'';
    inp.addEventListener('input',()=>client[inp.dataset.k]=inp.value);
  });
}
function go(d){
  const n=idx+d;
  if(n<0||n>=TOTAL)return;
  if(idx===TOTAL-1&&d>0)return;
  idx=n;render();
}
nextBtn.addEventListener('click',()=>{ if(idx===TOTAL-1){exportPDF();}else{go(1);} });
backBtn.addEventListener('click',()=>go(-1));
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea')||e.target.isContentEditable)return;
  if(e.key==='Enter'||e.key==='ArrowRight'){ if(idx===TOTAL-1)exportPDF(); else go(1); }
  if(e.key==='ArrowLeft')go(-1);
});
/* ---- écriture des éditions inline dans CONFIG ---- */
(function wireInline(){
  const st=document.getElementById('stage');
  st.addEventListener('focusin',e=>{const el=e.target.closest('[data-edit]');if(!el||!editEnabled)return;el.textContent=String(getPath(el.dataset.edit)??'');});
  st.addEventListener('input',e=>{const el=e.target.closest('[data-edit]');if(!el||!editEnabled)return;
    let v=el.textContent;
    if(el.dataset.num!==undefined){v=parseFloat(v.replace(/[^\d.,-]/g,'').replace(',','.'))||0;}
    setPath(el.dataset.edit,v); try{saveDraft();}catch(_){}});
  st.addEventListener('focusout',e=>{const el=e.target.closest('[data-edit]');if(!el||!editEnabled)return;
    const reformat = el.dataset.num!==undefined || /^screens\./.test(el.dataset.edit);
    if(reformat) setTimeout(render,0);           // diffère le re-render hors de l'événement blur
    if(typeof editorBuilt!=='undefined'&&editorBuilt)buildEditor();});
  st.addEventListener('keydown',e=>{const el=e.target.closest('[data-edit]');if(!el)return;
    if(e.key==='Enter'){e.preventDefault();el.blur();}});
})();

/* --- persistance locale (brouillon), tolérante --- */
function saveDraft(){try{localStorage.setItem(LS_KEY,JSON.stringify(CONFIG));}catch(e){}}

/* --- helpers de mise à jour par chemin --- */
function setPath(path,val){
  const p=path.split('.');let o=CONFIG;
  for(let i=0;i<p.length-1;i++){const k=/^\d+$/.test(p[i])?+p[i]:p[i];o=o[k];}
  const last=/^\d+$/.test(p[p.length-1])?+p[p.length-1]:p[p.length-1];
  o[last]=val;
}
function afterEdit(){saveDraft();render();}

/* --- construction du formulaire --- */
function field(label,path,val,type){
  const t=type==='area'
    ? `<textarea data-path="${path}" rows="3">${val??''}</textarea>`
    : `<input data-path="${path}" type="${type||'text'}" value="${(val??'').toString().replace(/"/g,'&quot;')}">`;
  return `<div class="ed-field"><label>${label}</label>${t}</div>`;
}

/* mappe un champ édité vers la page d'aperçu correspondante */
function pathToScreen(path){
  if(!path)return null;
  if(path==='__intro')return 0;
  if(path==='__contexte')return 1;
  if(path.indexOf('screens.')===0){const i=+path.split('.')[1];return isNaN(i)?null:i;}
  const head=path.split('.')[0];
  const map={prospect:0,entreprise:0,annee:0,discipline:0,devise:5,tva:5,
    processOverview:2,packs:3,modules:4,tech:6,planning:7,paiements:7,outils:8,emetteur:9};
  return head in map ? map[head] : null;
}
function jumpTo(s){ if(s!=null && s>=0 && s<screens.length) idx=s; }

/* --- écoute des modifications --- */
function wireEditor(){
  const body=$('edBody');
  body.addEventListener('input',e=>{
    const t=e.target;const path=t.getAttribute('data-path');
    if(!path)return;
    if(path==='__intro'){CONFIG.intro=t.value.split('\n').map(s=>s.trim()).filter(Boolean);}
    else if(path==='__contexte'){CONFIG.contexte=t.value.split('\n').map(s=>s.trim()).filter(Boolean);}
    else{setPath(path, t.type==='number'?(+t.value||0):t.value);}
    jumpTo(pathToScreen(path));   // l'aperçu saute sur la page éditée
    afterEdit();
  });
  body.addEventListener('change',e=>{
    const t=e.target;
    if(t.dataset.reco!==undefined){const i=+t.dataset.reco;CONFIG.packs.forEach((p,j)=>p.reco=(j===i&&t.checked));if(t.checked&&selectedPack)selectedPack=CONFIG.packs[i].id;jumpTo(3);buildEditor();afterEdit();return;}
    if(t.dataset.packmod!==undefined){
      const i=+t.dataset.packmod,k=t.dataset.key,arr=CONFIG.packs[i].modules;
      const order=Object.keys(CONFIG.modules);
      if(t.checked){if(!arr.includes(k))arr.push(k);}else{const x=arr.indexOf(k);if(x>-1)arr.splice(x,1);}
      CONFIG.packs[i].modules=order.filter(o=>arr.includes(o));jumpTo(3);afterEdit();return;
    }
    if(t.dataset.apay!==undefined){ensurePlanning();CONFIG.planning[t.dataset.apay].pay=t.checked;jumpTo(7);buildEditor();afterEdit();return;}
    if(t.dataset.logo!==undefined){                           // upload d'un logo outil → base64
      const f=t.files&&t.files[0];if(!f)return;
      const rd=new FileReader();
      rd.onload=()=>{CONFIG.outils[+t.dataset.logo].logo=rd.result;jumpTo(8);buildEditor();afterEdit();};
      rd.readAsDataURL(f);return;
    }
    if(t.dataset.techlogo!==undefined){                       // upload logo plateforme (Webflow/Framer)
      const f=t.files&&t.files[0];if(!f)return;
      const rd=new FileReader();
      rd.onload=()=>{CONFIG.tech.plateformes[+t.dataset.techlogo].logo=rd.result;jumpTo(6);buildEditor();afterEdit();};
      rd.readAsDataURL(f);return;
    }
  });
  body.addEventListener('click',e=>{
    const act=e.target.dataset.act;if(!act)return;
    if(act==='addProcess'){CONFIG.processOverview.push({titre:'Nouvelle étape',texte:''});jumpTo(2);buildEditor();afterEdit();}
    if(act==='delProcess'){CONFIG.processOverview.splice(+e.target.dataset.i,1);jumpTo(2);buildEditor();afterEdit();}
    if(act==='addModule'){const k=newModuleKey();CONFIG.modules[k]={nom:'Nouvelle prestation',prix:0,desc:'',livrable:''};jumpTo(4);buildEditor();afterEdit();}
    if(act==='delModule'){const k=e.target.dataset.key;delete CONFIG.modules[k];CONFIG.packs.forEach(p=>{const x=p.modules.indexOf(k);if(x>-1)p.modules.splice(x,1);});jumpTo(4);buildEditor();afterEdit();}
    if(act==='addOutil'){CONFIG.outils.push({ic:'■',nom:'Nouvel outil',p:'',logo:''});jumpTo(8);buildEditor();afterEdit();}
    if(act==='delOutil'){CONFIG.outils.splice(+e.target.dataset.i,1);jumpTo(8);buildEditor();afterEdit();}
    if(act==='delLogo'){CONFIG.outils[+e.target.dataset.i].logo='';jumpTo(8);buildEditor();afterEdit();}
    if(act==='delTechLogo'){CONFIG.tech.plateformes[+e.target.dataset.i].logo='';jumpTo(6);buildEditor();afterEdit();}
  });
}
function newModuleKey(){let n=1;while(CONFIG.modules['prestation'+n])n++;return 'prestation'+n;}

/* --- export d'un fichier HTML autonome à jour --- */
function exportHTML(){
  const cfgTxt=MARK_A+'\nconst CONFIG = '+JSON.stringify(CONFIG,null,2)+';\n'+MARK_B;
  const re=new RegExp(MARK_A.replace(/[.*+?^${}()|[\]\\/]/g,'\\$&')+'[\\s\\S]*?'+MARK_B.replace(/[.*+?^${}()|[\]\\/]/g,'\\$&'));
  let out=PRISTINE.replace(re,cfgTxt);
  if(!/^<!doctype/i.test(out))out='<!DOCTYPE html>\n'+out;
  const blob=new Blob([out],{type:'text/html'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='offre-'+(CONFIG.entreprise||'client').toLowerCase().replace(/\s+/g,'-')+'.html';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  toast('Fichier téléchargé ✓');
}

/* --- ouverture / fermeture --- */
function toggleEditor(open){
  const ed=$('editor');const o=open===undefined?!ed.classList.contains('open'):open;
  ed.classList.toggle('open',o);
}

/* =========================================================
   INIT
   ========================================================= */
let editorBuilt=false;
function enableEdit(open){
  editEnabled=true; previewMode=false;
  document.body.classList.add('editmode');
  if(!editorBuilt){buildEditor();wireEditor();editorBuilt=true;}   // brouillon déjà chargé dans init()
  $('editFab').classList.add('on');
  render();                       // re-render pour activer l'édition directe dans le canvas
  if(open)toggleEditor(true);
}
function setPreview(on){         // aperçu client sans recharger (garde tes modifs)
  previewMode=on;
  document.body.classList.toggle('editmode', !on);
  $('editFab').classList.toggle('on', !on);
  $('previewExit').style.display = on ? 'inline-flex' : 'none';
  if(on) toggleEditor(false);
  render();
}
function init(){
  if(init._done)return; init._done=true;
  PRISTINE=document.documentElement.outerHTML;   // capture AVANT toute injection (= valeurs du fichier)
  loadDraft();                                   // applique tes modifs sauvegardées, en mode normal ET édition
  if(!Array.isArray(CONFIG.screens)||CONFIG.screens.length!==DEFAULT_SCREENS.length){CONFIG.screens=DEFAULT_SCREENS.map(s=>({...s}));}  // réaligne les titres si brouillon périmé
  M = CONFIG.modules;                            // resynchronise la référence après fusion du brouillon
  selectedPack = CONFIG.packs.find(p=>p.reco)?.id || CONFIG.packs[0].id;
  render();
  if(editEnabled)enableEdit(false);
  // toggles éditeur
  $('editFab').addEventListener('click',()=>toggleEditor());
  $('edClose').addEventListener('click',()=>toggleEditor(false));
  $('edExport').addEventListener('click',exportHTML);
  $('edReset').addEventListener('click',()=>{try{localStorage.removeItem(LS_KEY);}catch(e){}location.reload();});
  $('edPreview').addEventListener('click',()=>setPreview(true));
  $('previewExit').addEventListener('click',()=>setPreview(false));
  // 1) activation quand on ajoute #edit à une page déjà ouverte (pas de rechargement)
  window.addEventListener('hashchange',()=>{ if(/edit/i.test(location.hash)) enableEdit(true); });
  // 2) raccourci compatible Mac : Maj+Alt+E (test sur ev.code, la touche Option ne casse plus rien)
  document.addEventListener('keydown',ev=>{
    if(ev.shiftKey&&ev.altKey&&ev.code==='KeyE'){ev.preventDefault();enableEdit(true);}
  });
  // 3) filet de sécurité : triple-clic sur le logo « Blue Dot » (invisible pour le client)
  let clicks=0,ct;const brand=document.querySelector('.brand');
  if(brand)brand.addEventListener('click',()=>{clicks++;clearTimeout(ct);ct=setTimeout(()=>clicks=0,600);if(clicks>=3){clicks=0;enableEdit(true);}});
}
document.addEventListener('DOMContentLoaded',init);
if(document.readyState!=='loading')init();   // si DOMContentLoaded a déjà eu lieu
</script>
